name: service_runner
description: A lightweight Flutter package for service initialization with lifecycle management, splash screen support, and a global service registry.
version: 1.0.1
homepage: https://nylo.dev
repository: https://github.com/nylo-core/service-runner
issue_tracker: https://github.com/nylo-core/service-runner/issues
documentation: https://github.com/nylo-core/service-runner
topics:
  - service-initialization
  - lifecycle-management
  - service-registry

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
